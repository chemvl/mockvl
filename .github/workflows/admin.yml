name: Admin CI

# Inverse path filter of ci.yml (Phase 8 decision-log note): admin-only
# changes skip the API jobs and vice versa. packages/** is shared surface —
# both workflows watch it.
on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/schemas/**"
      - ".github/workflows/admin.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "apps/admin/**"
      - "packages/schemas/**"
      - ".github/workflows/admin.yml"
      - "package.json"
      - "bun.lock"

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; keep GITHUB_TOKEN least-privilege.
permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      # Third-party actions pinned to commit SHAs: tags are mutable, and these
      # run with full repo access.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in step with ci.yml.
          bun-version: "1.4.2"

      - name: Install
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Generate API client
        # src/client is gitignored; regenerate it from the API's spec, dumped
        # offline (no server/DB needed) so it matches this commit's routes.
        run: |
          bun run --cwd ../.. openapi:dump
          bun run client:generate

      - name: Typecheck
        run: bun run tsc

      - name: Lint
        run: bun run biome:lint

      - name: Test
        run: bun run test

      - name: Build
        env:
          # vite.config interpolates this into `base` for non-dev modes;
          # unset would yield a literal "undefined" path prefix.
          VITE_BASE_URL_PUBLIC: "/"
        run: bun run build
